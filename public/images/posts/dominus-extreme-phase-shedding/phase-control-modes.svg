<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="520" fill="#0f0f0f"/>

  <text x="40" y="40" fill="#e5e5e5" font-size="22" font-weight="700">BIOS: CPU Power Phase Control</text>
  <text x="40" y="62" fill="#999999" font-size="13">The one knob that decides all this — and where I leave it. Pips show active phases at idle.</text>

  <!-- ===== Standard ===== -->
  <rect x="40" y="82" width="820" height="80" rx="10" fill="#151515" stroke="#2a2a2a"/>
  <text x="64" y="118" fill="#cccccc" font-size="17" font-weight="700">Standard</text>
  <text x="64" y="143" fill="#999999" font-size="12">Sheds aggressively — best idle efficiency</text>
  <text x="580" y="104" fill="#999999" font-size="10">at idle:</text>
  <rect x="580" y="110" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="612" y="110" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="644" y="110" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="676" y="110" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="708" y="110" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="740" y="110" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="772" y="110" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="804" y="110" width="26" height="36" rx="6" fill="#333333"/>

  <!-- ===== Optimized ===== -->
  <rect x="40" y="177" width="820" height="80" rx="10" fill="#151515" stroke="#2a2a2a"/>
  <text x="64" y="213" fill="#cccccc" font-size="17" font-weight="700">Optimized</text>
  <text x="64" y="238" fill="#999999" font-size="12">ASUS balanced profile for daily, fluctuating load</text>
  <text x="580" y="199" fill="#999999" font-size="10">at idle:</text>
  <rect x="580" y="205" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="612" y="205" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="644" y="205" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="676" y="205" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="708" y="205" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="740" y="205" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="772" y="205" width="26" height="36" rx="6" fill="#333333"/>
  <rect x="804" y="205" width="26" height="36" rx="6" fill="#333333"/>

  <!-- ===== Extreme (highlighted) ===== -->
  <rect x="40" y="272" width="820" height="80" rx="10" fill="#13251a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="64" y="308" fill="#4ade80" font-size="17" font-weight="700">Extreme  ★</text>
  <text x="64" y="333" fill="#cccccc" font-size="12">Never sheds — all 8 phases (32 stages) always on</text>
  <text x="300" y="308" fill="#4ade80" font-size="13" font-weight="600">← I leave it here</text>
  <text x="580" y="294" fill="#999999" font-size="10">at idle:</text>
  <rect x="580" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="612" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="644" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="676" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="708" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="740" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="772" y="300" width="26" height="36" rx="6" fill="#4ade80"/>
  <rect x="804" y="300" width="26" height="36" rx="6" fill="#4ade80"/>

  <!-- ===== callout ===== -->
  <rect x="40" y="370" width="820" height="102" rx="10" fill="#151515" stroke="#e8a96a"/>
  <text x="64" y="398" fill="#e8a96a" font-size="14" font-weight="700">Why Extreme on this board?</text>
  <text x="64" y="422" fill="#cccccc" font-size="13">Shedding would save only a handful of idle watts — nothing on a 400W-capable platform this</text>
  <text x="64" y="443" fill="#cccccc" font-size="13">overbuilt. So I keep all 32 stages lit, all the time. Flat transient response, and the array</text>
  <text x="64" y="464" fill="#cccccc" font-size="13">never even gets warm.</text>

  <text x="892" y="513" text-anchor="end" fill="#ffffff" fill-opacity="0.55" font-size="12">markspcparts.com</text>
</svg>
