<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#0f0f0f"/>

  <text x="40" y="40" fill="#e5e5e5" font-size="22" font-weight="700">How the Dominus sheds — in chunks of four</text>
  <text x="40" y="62" fill="#999999" font-size="13">One ASP1405I controller drives 8 phase channels, each fanning out to 4 teamed IR3555 stages</text>

  <!-- controller -->
  <rect x="40" y="205" width="165" height="100" rx="10" fill="#13251a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="122" y="242" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="700">ASP1405I</text>
  <text x="122" y="264" text-anchor="middle" fill="#999999" font-size="11">= Infineon IR35201</text>
  <text x="122" y="284" text-anchor="middle" fill="#999999" font-size="11">8-phase digital PWM</text>

  <text x="335" y="86" text-anchor="middle" fill="#e8a96a" font-size="13" font-weight="600">8 phases  ×  4 teamed IR3555 stages  =  32</text>

  <!-- fan-out lines P1..P7 (active) -->
  <line x1="205" y1="255" x2="240" y2="105" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="150" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="195" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="240" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="285" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="330" stroke="#555555" stroke-width="1.2"/>
  <line x1="205" y1="255" x2="240" y2="375" stroke="#555555" stroke-width="1.2"/>
  <!-- fan-out to P8 (shed) -->
  <line x1="205" y1="255" x2="240" y2="420" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ===== Rows P1..P7 : 4 IR3555 stages each ===== -->
  <!-- P1 y=105 -->
  <text x="234" y="109" text-anchor="end" fill="#999999" font-size="12">P1</text>
  <rect x="245" y="91" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="91" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="91" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="91" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="105" x2="518" y2="105" stroke="#444444" stroke-width="1.4"/>
  <!-- P2 y=150 -->
  <text x="234" y="154" text-anchor="end" fill="#999999" font-size="12">P2</text>
  <rect x="245" y="136" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="136" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="136" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="136" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="150" x2="518" y2="150" stroke="#444444" stroke-width="1.4"/>
  <!-- P3 y=195 -->
  <text x="234" y="199" text-anchor="end" fill="#999999" font-size="12">P3</text>
  <rect x="245" y="181" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="181" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="181" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="181" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="195" x2="518" y2="195" stroke="#444444" stroke-width="1.4"/>
  <!-- P4 y=240 -->
  <text x="234" y="244" text-anchor="end" fill="#999999" font-size="12">P4</text>
  <rect x="245" y="226" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="226" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="226" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="226" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="240" x2="518" y2="240" stroke="#444444" stroke-width="1.4"/>
  <!-- P5 y=285 -->
  <text x="234" y="289" text-anchor="end" fill="#999999" font-size="12">P5</text>
  <rect x="245" y="271" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="271" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="271" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="271" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="285" x2="518" y2="285" stroke="#444444" stroke-width="1.4"/>
  <!-- P6 y=330 -->
  <text x="234" y="334" text-anchor="end" fill="#999999" font-size="12">P6</text>
  <rect x="245" y="316" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="316" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="316" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="316" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="330" x2="518" y2="330" stroke="#444444" stroke-width="1.4"/>
  <!-- P7 y=375 -->
  <text x="234" y="379" text-anchor="end" fill="#999999" font-size="12">P7</text>
  <rect x="245" y="361" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="291" y="361" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="337" y="361" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <rect x="383" y="361" width="42" height="28" rx="4" fill="#1c1c1c" stroke="#666666"/>
  <line x1="425" y1="375" x2="518" y2="375" stroke="#444444" stroke-width="1.4"/>

  <!-- P8 y=420 : SHED (parked) -->
  <text x="234" y="424" text-anchor="end" fill="#f87171" font-size="12">P8</text>
  <rect x="245" y="406" width="42" height="28" rx="4" fill="#1a1414" stroke="#f87171" stroke-dasharray="4 3"/>
  <rect x="291" y="406" width="42" height="28" rx="4" fill="#1a1414" stroke="#f87171" stroke-dasharray="4 3"/>
  <rect x="337" y="406" width="42" height="28" rx="4" fill="#1a1414" stroke="#f87171" stroke-dasharray="4 3"/>
  <rect x="383" y="406" width="42" height="28" rx="4" fill="#1a1414" stroke="#f87171" stroke-dasharray="4 3"/>
  <rect x="240" y="401" width="190" height="38" rx="6" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="335" y="456" text-anchor="middle" fill="#f87171" font-size="11">1 shed = this whole channel · 4 stages at once</text>

  <!-- output bus + socket -->
  <line x1="518" y1="105" x2="518" y2="375" stroke="#666666" stroke-width="2"/>
  <line x1="518" y1="240" x2="600" y2="240" stroke="#666666" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="600" y="190" width="175" height="100" rx="10" fill="#1c1c1c" stroke="#666666"/>
  <text x="687" y="228" text-anchor="middle" fill="#e5e5e5" font-size="15" font-weight="700">CPU Vcore</text>
  <text x="687" y="250" text-anchor="middle" fill="#999999" font-size="11">into the W-3175X</text>
  <text x="687" y="270" text-anchor="middle" fill="#999999" font-size="11">LGA 3647 socket</text>

  <text x="892" y="513" text-anchor="end" fill="#ffffff" fill-opacity="0.55" font-size="12">markspcparts.com</text>
</svg>
