<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><rect width="900" height="520" fill="#0f0f0f"/><text x="40" y="36" font-size="20" fill="#f1f1f1" font-weight="600">13 probe pads: what HWiNFO shows at idle</text><text x="40" y="58" font-size="13" fill="#999">Pads 2–14 (pad 1 is GND, the black-probe reference). 8 of 13 have no software sensor — highlighted.</text><text x="50" y="90" font-size="11" fill="#999">PAD</text><text x="110" y="90" font-size="11" fill="#999">NAME</text><text x="440" y="90" font-size="11" fill="#999" text-anchor="end">HWiNFO IDLE</text><rect x="40" y="98" width="420" height="26" rx="6" fill="#161616" stroke="#2a2a2a"/><text x="50" y="117" font-size="13" fill="#999">2</text><text x="110" y="117" font-size="14" fill="#ccc">VIN</text><text x="440" y="117" font-size="14" fill="#4ade80" text-anchor="end" font-family="ui-monospace, Consolas, monospace">1.776 V</text><rect x="40" y="127" width="420" height="26" rx="6" fill="#161616" stroke="#2a2a2a"/><text x="50" y="146" font-size="13" fill="#999">3</text><text x="110" y="146" font-size="14" fill="#ccc">VSA</text><text x="440" y="146" font-size="14" fill="#4ade80" text-anchor="end" font-family="ui-monospace, Consolas, monospace">0.896 V</text><rect x="40" y="156" width="420" height="26" rx="6" fill="#161616" stroke="#2a2a2a"/><text x="50" y="175" font-size="13" fill="#999">4</text><text x="110" y="175" font-size="14" fill="#ccc">IO</text><text x="440" y="175" font-size="14" fill="#4ade80" text-anchor="end" font-family="ui-monospace, Consolas, monospace">1.056 V</text><rect x="40" y="185" width="420" height="26" rx="6" fill="#161616" stroke="#2a2a2a"/><text x="50" y="204" font-size="13" fill="#999">5</text><text x="110" y="204" font-size="14" fill="#ccc">DRAM_ABC</text><text x="440" y="204" font-size="14" fill="#4ade80" text-anchor="end" font-family="ui-monospace, Consolas, monospace">1.403 V</text><rect x="40" y="214" width="420" height="26" rx="6" fill="#161616" stroke="#2a2a2a"/><text x="50" y="233" font-size="13" fill="#999">6</text><text x="110" y="233" font-size="14" fill="#ccc">DRAM_DEF</text><text x="440" y="233" font-size="14" fill="#4ade80" text-anchor="end" font-family="ui-monospace, Consolas, monospace">1.412 V</text><rect x="40" y="243" width="420" height="26" rx="6" fill="#e8a96a" fill-opacity="0.14" stroke="#e8a96a" stroke-width="1.5"/><text x="50" y="262" font-size="13" fill="#e8a96a">7</text><text x="110" y="262" font-size="14" fill="#f1f1f1" font-weight="600">COREA</text><text x="440" y="262" font-size="14" fill="#e8a96a" text-anchor="end" font-weight="600">not exposed</text><rect x="40" y="272" width="420" height="26" rx="6" fill="#e8a96a" fill-opacity="0.14" stroke="#e8a96a" stroke-width="1.5"/><text x="50" y="291" font-size="13" fill="#e8a96a">8</text><text x="110" y="291" font-size="14" fill="#f1f1f1" font-weight="600">COREB</text><text x="440" y="291" font-size="14" fill="#e8a96a" text-anchor="end" font-weight="600">not exposed</text><rect x="40" y="301" width="420" height="26" rx="6" fill="#e8a96a" fill-opacity="0.14" stroke="#e8a96a" stroke-width="1.5"/><text x="50" y="320" font-size="13" fill="#e8a96a">9</text><text x="110" y="320" font-size="14" fill="#f1f1f1" font-weight="600">CACHE0</text><text x="440" y="320" font-size="14" fill="#e8a96a" text-anchor="end" font-weight="600">not exposed</text><rect x="40" y="330" width="420" height="26" rx="6" fill="#e8a96a" fill-opacity="0.14" stroke="#e8a96a" stroke-width="1.5"/><text x="50" y="349" font-size="13" fill="#e8a96a">10</text><text x="110" y="349" font-size="14" fill="#f1f1f1" font-weight="600">IO_A_DEF</text><text x="440" y="349" font-size="14" fill="#e8a96a" text-anchor="end" font-weight="600">not exposed</text><rect x="40" y="359" width="420" height="26" rx="6" fill="#e8a96a" fill-opacity="0.14" stroke="#e8a96a" stroke-width="1.5"/><text x="50" y="378" font-size="13" fill="#e8a96a">11</text><text x="110" y="378" font-size