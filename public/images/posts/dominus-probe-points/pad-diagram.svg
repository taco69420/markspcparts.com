<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><rect width="900" height="520" fill="#0f0f0f"/><text x="40" y="34" font-size="20" fill="#f1f1f1" font-weight="600">ROG Dominus Extreme probe header — in the order ASUS prints it</text><text x="40" y="54" font-size="12" fill="#999">GND plus 13 pads, numbered top to bottom as in the ASUS manual diagram. Labels are ASUS’s; I add nothing to them.</text><rect x="40" y="68" width="48" height="404" rx="8" fill="#161616" stroke="#2a2a2a"/><circle cx="64" cy="92" r="11" fill="none" fill-opacity="1" stroke="#f1f1f1" stroke-width="1.5"/><text x="64" y="96.5" font-size="11" fill="#f1f1f1" text-anchor="middle" font-weight="700">1</text><text x="110" y="97" font-size="15" fill="#f1f1f1" font-weight="600">GND</text><text x="250" y="97" font-size="12" fill="#ccc">reference (GND)</text><text x="490" y="97" font-size="11" fill="#999">black probe reference</text><circle cx="64" cy="121" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="125.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">2</text><text x="110" y="126" font-size="15" fill="#e8a96a" font-weight="600">VIN</text><text x="250" y="126" font-size="12" fill="#ccc">has a software sensor, but it disagrees under load</text><circle cx="64" cy="150" r="11" fill="#4ade80" fill-opacity="1" stroke="#4ade80" stroke-width="1.5"/><text x="64" y="154.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">3</text><text x="110" y="155" font-size="15" fill="#4ade80" font-weight="600">VSA</text><text x="250" y="155" font-size="12" fill="#ccc">measured · matches a software sensor</text><circle cx="64" cy="179" r="11" fill="#4ade80" fill-opacity="1" stroke="#4ade80" stroke-width="1.5"/><text x="64" y="183.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">4</text><text x="110" y="184" font-size="15" fill="#4ade80" font-weight="600">IO</text><text x="250" y="184" font-size="12" fill="#ccc">measured · matches a software sensor</text><circle cx="64" cy="208" r="11" fill="#4ade80" fill-opacity="1" stroke="#4ade80" stroke-width="1.5"/><text x="64" y="212.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">5</text><text x="110" y="213" font-size="15" fill="#4ade80" font-weight="600">DRAM_ABC</text><text x="250" y="213" font-size="12" fill="#ccc">measured · matches a software sensor</text><circle cx="64" cy="237" r="11" fill="#4ade80" fill-opacity="1" stroke="#4ade80" stroke-width="1.5"/><text x="64" y="241.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">6</text><text x="110" y="242" font-size="15" fill="#4ade80" font-weight="600">DRAM_DEF</text><text x="250" y="242" font-size="12" fill="#ccc">measured · matches a software sensor</text><circle cx="64" cy="266" r="11" fill="#999" fill-opacity="0.15" stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"/><text x="64" y="270.5" font-size="11" fill="#999" text-anchor="middle" font-weight="700">7</text><text x="110" y="271" font-size="15" fill="#999" font-weight="600">COREA</text><text x="250" y="271" font-size="12" fill="#ccc">unknown</text><text x="490" y="271" font-size="11" fill="#999">ASUS label only — I don’t know what it feeds</text><circle cx="64" cy="295" r="11" fill="#999" fill-opacity="0.15" stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"/><text x="64" y="299.5" font-size="11" fill="#999" text-anchor="middle" font-weight="700">8</text><text x="110" y="300" font-size="15" fill="#999" font-weight="600">COREB</text><text x="250" y="300" font-size="12" fill="#ccc">unknown</text><text x="490" y="300" font-size="11" fill="#999">reads close to the BIOS Core Voltage readout (read in different states)</text><circle cx="64" cy="324" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="328.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">9</text><text x="110" y="329" font-size="15" fill="#e8a96a" font-weight="600">CACHE0</text><text x="250" y="329" font-size="12" fill="#ccc">measured · no software sensor</text><circle cx="64" cy="353" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="357.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">10</text><text x="110" y="358" font-size="15" fill="#e8a96a" font-weight="600">IO_A_DEF</text><text x="250" y="358" font-size="12" fill="#ccc">measured · no software sensor</text><text x="490" y="358" font-size="11" fill="#999">label only</text><circle cx="64" cy="382" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="386.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">11</text><text x="110" y="387" font-size="15" fill="#e8a96a" font-weight="600">IO_D_DEF</text><text x="250" y="387" font-size="12" fill="#ccc">measured · no software sensor</text><text x="490" y="387" font-size="11" fill="#999">label only</text><circle cx="64" cy="411" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="415.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">12</text><text x="110" y="416" font-size="15" fill="#e8a96a" font-weight="600">SFR</text><text x="250" y="416" font-size="12" fill="#ccc">measured · no software sensor</text><text x="490" y="416" font-size="11" fill="#999">label only</text><circle cx="64" cy="440" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="444.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">13</text><text x="110" y="445" font-size="15" fill="#e8a96a" font-weight="600">IO_A_ABC</text><text x="250" y="445" font-size="12" fill="#ccc">measured · no software sensor</text><text x="490" y="445" font-size="11" fill="#999">label only</text><circle cx="64" cy="469" r="11" fill="#e8a96a" fill-opacity="1" stroke="#e8a96a" stroke-width="1.5"/><text x="64" y="473.5" font-size="11" fill="#0f0f0f" text-anchor="middle" font-weight="700">14</text><text x="110" y="474" font-size="15" fill="#e8a96a" font-weight="600">IO_D_ABC</text><text x="250" y="474" font-size="12" fill="#ccc">measured · no software sensor</text><text x="490" y="474" font-size="11" fill="#999">label only</text><circle cx="52" cy="497" r="6" fill="#4ade80"/><text x="64" y="501" font-size="12" fill="#ccc">measured, matches a software sensor</text><circle cx="307" cy="497" r="6" fill="#e8a96a"/><text x="319" y="501" font-size="12" fill="#ccc">measured, no software sensor (or it disagrees: VIN)</text><circle cx="692" cy="497" r="6" fill="#999" fill-opacity="0.15" stroke="#999" stroke-dasharray="3 2"/><text x="704" y="501" font-size="12" fill="#ccc">unknown</text><text x="892" y="513" text-anchor="end" font-size="12" fill="#fff" opacity="0.55">markspcparts.com</text></svg>
