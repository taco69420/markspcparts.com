<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><rect width="900" height="520" fill="#0f0f0f"/><text x="40" y="36" font-size="20" fill="#f1f1f1" font-weight="600">Load minus idle, in millivolts</text><text x="40" y="58" font-size="13" fill="#999">Multimeter bars; hollow diamonds = HWiNFO on the 5 rails that have a sensor. Shaded band = ±10 mV.</text><rect x="220" y="84" width="40" height="366" fill="#4ade80" fill-opacity="0.12"/><line x1="140" x2="140" y1="84" y2="450" stroke="#222"/><text x="140" y="468" font-size="11" fill="#999" text-anchor="middle">-50</text><line x1="240" x2="240" y1="84" y2="450" stroke="#555"/><text x="240" y="468" font-size="11" fill="#999" text-anchor="middle">0</text><line x1="340" x2="340" y1="84" y2="450" stroke="#222"/><text x="340" y="468" font-size="11" fill="#999" text-anchor="middle">50</text><line x1="440" x2="440" y1="84" y2="450" stroke="#222"/><text x="440" y="468" font-size="11" fill="#999" text-anchor="middle">100</text><line x1="540" x2="540" y1="84" y2="450" stroke="#222"/><text x="540" y="468" font-size="11" fill="#999" text-anchor="middle">150</text><line x1="640" x2="640" y1="84" y2="450" stroke="#222"/><text x="640" y="468" font-size="11" fill="#999" text-anchor="middle">200</text><text x="390" y="484" font-size="11" fill="#999" text-anchor="middle">mV (load − idle)</text><text x="130" y="106" font-size="13" fill="#ccc" text-anchor="end">2 VIN</text><rect x="240" y="95" width="188" height="15" rx="3" fill="#f87171"/><path d="M186 96 l6 6.5 l-6 6.5 l-6 -6.5 z" fill="#0f0f0f" stroke="#e8a96a" stroke-width="2"/><text x="436" y="107" font-size="12" fill="#f87171">+94 mV  (HWiNFO −27)</text><text x="130" y="136" font-size="13" fill="#ccc" text-anchor="end">3 VSA</text><rect x="240" y="125" width="2" height="15" rx="3" fill="#4ade80"/><path d="M240 126 l6 6.5 l-6 6.5 l-6 -6.5 z" fill="#0f0f0f" stroke="#e8a96a" stroke-width="2"/><text x="254" y="137" font-size="12" fill="#ccc">±0 mV  (HWiNFO ±0)</text><text x="130" y="166" font-size="13" fill="#ccc" text-anchor="end">4 IO</text><rect x="240" y="155" width="40" height="15" rx="3" fill="#f87171"/><path d="M304 156 l6 6.5 l-6 6.5 l-6 -6.5 z" fill="#0f0f0f" stroke="#e8a96a" stroke-width="2"/><text x="318" y="167" font-size="12" fill="#f87171">+20 mV  (HWiNFO +32)</text><text x="130" y="196" font-size="13" fill="#ccc" text-anchor="end">5 DRAM_ABC</text><rect x="238" y="185" width="2" height="15" rx="3" fill="#4ade80"/><path d="M240 186 l6 6.5 l-6 6.5 l-6 -6.5 z" fill="#0f0f0f" stroke="#e8a96a" stroke-width="2"/><text x="254" y="197" font-size="12" fill="#ccc">−1 mV  (HWiNFO ±0)</text><text x="130" y="226" font-size="13" fill="#ccc" text-anchor="end">6 DRAM_DEF</text><rect x="236" y="215" width="4" height="15" rx="3" fill="#4ade80"/><path d="M222 216 l6 6.5 l-6 6.5 l-6 -6.5 z" fill="#0f0f0f" stroke="#e8a96a" stroke-width="2"/><text x="248" y="227" font-size="12" fill="#ccc">−2 mV  (HWiNFO −9)</text><text x="130" y="256" font-size="13" fill="#ccc" text-anchor="end">8 COREB</text><rect x="240" y="245" width="4" height="15" rx="3" fill="#4ade80"/><text x="252" y="257" font-size="12" fill="#ccc">+2 mV</text><text x="130" y="286" font-size="13" fill="#ccc" text-anchor="end">9 CACHE0</text><rect x="240" y="275" width="4" height="15" rx="3" fill="#4ade80"/><text x="252" y="287" font-size="12" fill="#ccc">+2 mV</text><text x="130" y="316" font-size="13" fill="#ccc" text-anchor="end">10 IO_A_DEF</text><rect x="232" y="305" width="8" height="15" rx="3" fill="#4ade80"/><text x="248" y="317" font-size="12" fill="#ccc">−4 mV</text><text x="130" y="346" font-size="13" fill="#ccc" text-anchor="end">11 IO_D_DEF</text><rect x="240" y="335" width="368" height="15" rx="3" fill="#f87171"/><text x="616" y="347" font-size="12" fill="#f87171">+184 mV</text><text x="130" y="376" font-size="13" fill="#ccc" text-anchor="end">12 SFR</text><rect x="240" y="365" width="12" height="15" rx="3" fill="#4ade80"/><text x="260" y="377" font-size="12" fill="#ccc">+6 mV</text><text x="130" y="406" font-size="13" fill="#ccc" text-anchor="end">13 IO_A_ABC</text><rect x="232" y="395" width="8" height="15" rx="3" fill="#4ade80"/><text x="248" y="407" font-size="12" fill="#ccc">−4 mV</text><text x="130" y="436" font-size="13" fill="#ccc" text-anchor="end">14 IO_D_ABC</text><rect x="236" y="425" width="4" height="15" rx="3" fill="#4ade80"/><text x="248" y="437" font-size="12" fill="#ccc">−2 mV</text><rect x="700" y="84" width="185" height="200" rx="10" fill="#161616" stroke="#e8a96a" stroke-width="1.5"/><text x="716" y="112" font-size="16" fill="#e8a96a" font-weight="600">COREA</text><text x="716" y="130" font-size="12" fill="#999">excluded from this chart</text><text x="716" y="160" font-size="12" fill="#999">idle</text><text x="716" y="182" font-size="15" fill="#f1f1f1">wandering</text><text x="716" y="202" font-size="17" fill="#f1f1f1" font-weight="600">0.20–0.81 V</text><text x="716" y="232" font-size="12" fill="#999">load</text><text x="716" y="256" font-size="17" fill="#4ade80" font-weight="600">1.048 V</text><text x="716" y="276" font-size="11" fill="#999">idle retested, same behavior</text><text x="700" y="310" font-size="12" fill="#999">No single idle value, so</text><text x="700" y="328" font-size="12" fill="#999">there is no honest delta.</text><text x="40" y="504" font-size="12" fill="#999">Idle probed Nov 8, load Nov 9 — different days. ±10 mV is roughly the meter’s tolerance here (about ±7–11 mV).</text><text x="892" y="513" text-anchor="end" font-size="12" fill="#fff" opacity="0.55">markspcparts.com</text></svg>
