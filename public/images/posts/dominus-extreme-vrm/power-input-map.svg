<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#e5e5e5">POWER CONNECTOR <tspan fill="#e8a96a">INVENTORY</tspan></text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#999">ROG Dominus Extreme — 8 power inputs plus the EZ_PLUG. A parts list, not a map of what feeds what.</text>

  <!-- Row 1: 24-pin ATX -->
  <rect x="60" y="96" width="780" height="56" rx="8" fill="#161616" stroke="#e8a96a" stroke-width="2"/>
  <text x="84" y="130" font-size="17" font-weight="700" fill="#f0f0f0">2× 24-pin ATX</text>
  <text x="360" y="130" font-size="13" fill="#e8a96a">on the board — I haven't traced where it goes</text>

  <!-- Row 2: 8-pin EPS -->
  <rect x="60" y="166" width="780" height="56" rx="8" fill="#161616" stroke="#e8a96a" stroke-width="2"/>
  <text x="84" y="200" font-size="17" font-weight="700" fill="#f0f0f0">4× 8-pin EPS</text>
  <text x="360" y="200" font-size="13" fill="#e8a96a">on the board — I haven't traced where it goes</text>

  <!-- Row 3: 6-pin EATX 12V (feeds CPU VRM) -->
  <rect x="60" y="236" width="780" height="56" rx="8" fill="#13241a" stroke="#4ade80" stroke-width="2"/>
  <text x="84" y="270" font-size="17" font-weight="700" fill="#f0f0f0">2× 6-pin EATX 12V</text>
  <text x="360" y="270" font-size="13" fill="#4ade80">feed the CPU VRM (confirmed on my board)</text>

  <!-- Row 4: 6-pin EZ_PLUG (PCIe, not CPU) -->
  <rect x="60" y="306" width="780" height="56" rx="8" fill="#161616" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="84" y="340" font-size="17" font-weight="700" fill="#f0f0f0">1× 6-pin EZ_PLUG</text>
  <text x="360" y="340" font-size="13" fill="#ccc">supplementary PCIe slot power for multi-GPU — not CPU power</text>

  <!-- Legend -->
  <rect x="60" y="381" width="12" height="12" rx="2" fill="#4ade80"/>
  <text x="80" y="391" font-size="12" fill="#ccc">feeds the CPU VRM</text>
  <rect x="230" y="381" width="12" height="12" rx="2" fill="#e8a96a"/>
  <text x="250" y="391" font-size="12" fill="#ccc">on the board, not traced</text>
  <rect x="430" y="381" width="12" height="12" rx="2" fill="none" stroke="#999" stroke-dasharray="3 2"/>
  <text x="450" y="391" font-size="12" fill="#ccc">PCIe slot power, not CPU</text>

  <!-- Contrast aside -->
  <rect x="60" y="412" width="780" height="62" rx="10" fill="#141414" stroke="#3f3f3f" stroke-width="1.5"/>
  <text x="84" y="440" font-size="13" font-weight="700" fill="#999">For contrast &#8212;</text>
  <text x="84" y="460" font-size="13" fill="#999">A normal flagship board: <tspan fill="#ccc" font-weight="700">2× 8-pin EPS.</tspan> The Dominus has 4× 8-pin EPS, 2× EATX 12V and the EZ_PLUG.</text>

  <!-- Watermark -->
  <text x="892" y="513" text-anchor="end" fill="#ffffff" opacity="0.55" font-size="12">markspcparts.com</text>
</svg>
