<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e5e5">14 × 14 INCHES &#8212; <tspan fill="#e8a96a">THE SIZE OF A LARGE PIZZA</tspan></text>
  <text x="450" y="61" text-anchor="middle" font-size="13" fill="#999">Board footprint, to scale &#8212; as mounted in a case, rear I/O corner (top-left) lined up</text>

  <!-- Scale: 28 px per inch. Shared top-left corner at x=110, y=86 -->
  <!-- Dominus 14 W x 14 H = 392x392 ; E-ATX 13 W x 12 H (330 x 305 mm) = 364x336 ; ATX 9.6 W x 12 H (244 x 305 mm) = 269x336 -->

  <!-- Largest: Dominus 14x14 (green) -->
  <rect x="110" y="86" width="392" height="392" rx="8" fill="#11241a" stroke="#4ade80" stroke-width="2.5"/>

  <!-- Pizza: 14in dashed circle inscribed in Dominus square -->
  <circle cx="306" cy="282" r="196" fill="#4ade80" opacity="0.04"/>
  <circle cx="306" cy="282" r="196" fill="none" stroke="#e8a96a" stroke-width="1.8" stroke-dasharray="6 7" opacity="0.7"/>

  <!-- E-ATX 13 W x 12 H (amber) -->
  <rect x="110" y="86" width="364" height="336" rx="8" fill="none" stroke="#e8a96a" stroke-width="2.2"/>

  <!-- ATX 9.6 W x 12 H (grey) -->
  <rect x="110" y="86" width="269" height="336" rx="8" fill="none" stroke="#999" stroke-width="2"/>

  <!-- Pizza label, in the strip only the Dominus covers -->
  <text x="306" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#e8a96a" opacity="0.9">Large hand-tossed &#8212; same 14" footprint</text>

  <!-- Labels: stacked right, color-keyed -->
  <g>
    <rect x="556" y="120" width="20" height="20" rx="4" fill="none" stroke="#4ade80" stroke-width="2.5"/>
    <text x="586" y="130" font-size="14" font-weight="700" fill="#4ade80">ROG Dominus Extreme</text>
    <text x="586" y="148" font-size="12" fill="#ccc">14 × 14 in (356 × 356 mm) &#8212; 12 DIMM slots</text>
  </g>
  <g>
    <rect x="556" y="180" width="20" height="20" rx="4" fill="none" stroke="#e8a96a" stroke-width="2.2"/>
    <text x="586" y="190" font-size="14" font-weight="700" fill="#e8a96a">E-ATX</text>
    <text x="586" y="208" font-size="12" fill="#ccc">12 × 13 in (305 × 330 mm) at full spec</text>
  </g>
  <g>
    <rect x="556" y="240" width="20" height="20" rx="4" fill="none" stroke="#999" stroke-width="2"/>
    <text x="586" y="250" font-size="14" font-weight="700" fill="#bbb">Standard ATX</text>
    <text x="586" y="268" font-size="12" fill="#ccc">12 × 9.6 in (305 × 244 mm)</text>
  </g>

  <!-- Watermark -->
  <text x="892" y="513" text-anchor="end" fill="#ffffff" opacity="0.55" font-size="12">markspcparts.com</text>
</svg>
